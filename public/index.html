<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guitar Pedal Price Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            max-width: 1400px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 30px;
            margin-top: 20px;
        }
        .main-layout {
            display: flex;
            gap: 20px;
            min-height: 600px;
        }
        .history-sidebar {
            width: 33.333%;
            min-width: 300px;
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            overflow-y: auto;
            max-height: calc(100vh - 200px);
        }
        .main-content {
            width: 66.666%;
            flex: 1;
        }
        h1 {
            color: #667eea;
            margin-bottom: 30px;
            font-weight: 700;
        }
        .input-section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: 600;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .results-section {
            margin-top: 30px;
        }
        .table {
            background: white;
        }
        .table thead {
            background: #667eea;
            color: white;
        }
        .price-cell {
            font-weight: 600;
            color: #28a745;
        }
        .offer-cell {
            font-weight: 700;
            color: #764ba2;
            font-size: 1.1em;
        }
        .total-row {
            background: #e3f2fd !important;
            font-weight: 700;
        }
        .offer-row {
            background: #f3e5f5 !important;
            font-weight: 700;
        }
        .no-match {
            color: #dc3545;
            font-style: italic;
        }
        .loading {
            text-align: center;
            padding: 40px;
        }
        .spinner-border {
            width: 3rem;
            height: 3rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- User Section -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1><i class="bi bi-guitar"></i> Guitar Pedal Price Calculator</h1>
            <div id="userSection">
                <span id="userInfo" class="me-3" style="display: none;"></span>
                <button class="btn btn-outline-primary" onclick="showLoginModal()" id="loginBtn">Login</button>
                <button class="btn btn-outline-danger" onclick="logout()" id="logoutBtn" style="display: none;">Logout</button>
            </div>
        </div>

        <!-- Login/Register Modal -->
        <div class="modal fade" id="authModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="authModalTitle">Login</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div id="authTabs" class="mb-3">
                            <button class="btn btn-sm btn-outline-primary active" onclick="switchAuthTab('login')">Login</button>
                            <button class="btn btn-sm btn-outline-primary" onclick="switchAuthTab('register')">Register</button>
                        </div>
                        <div id="loginForm">
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" id="loginEmail" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <input type="password" class="form-control" id="loginPassword" required>
                            </div>
                            <button class="btn btn-primary w-100" onclick="login()">Login</button>
                        </div>
                        <div id="registerForm" style="display: none;">
                            <div class="mb-3">
                                <label class="form-label">Name</label>
                                <input type="text" class="form-control" id="registerName" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" id="registerEmail" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <input type="password" class="form-control" id="registerPassword" required>
                            </div>
                            <button class="btn btn-primary w-100" onclick="register()">Register</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Layout: History Sidebar + Main Content -->
        <div class="main-layout">
            <!-- Left Sidebar: Calculation History -->
            <div class="history-sidebar">
                <div id="historySection" style="display: none;">
                    <h5 class="mb-3"><i class="bi bi-clock-history"></i> Calculation History</h5>
                    <div id="historyList"></div>
                </div>
                <div id="historyPlaceholder" class="text-center text-muted" style="padding: 40px 0;">
                    <i class="bi bi-clock-history" style="font-size: 3rem; opacity: 0.3;"></i>
                    <p class="mt-3">Login to see your calculation history</p>
                </div>
            </div>

            <!-- Right Main Content -->
            <div class="main-content">
                <!-- Input Section -->
        <div class="input-section">
            <h3 class="mb-4">Input Method</h3>
            
            <!-- Tab Navigation -->
            <ul class="nav nav-tabs mb-4" id="inputTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="text-tab" data-bs-toggle="tab" data-bs-target="#text-input" type="button">
                        <i class="bi bi-textarea-t"></i> Text Input
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="file-tab" data-bs-toggle="tab" data-bs-target="#file-input" type="button">
                        <i class="bi bi-file-earmark-spreadsheet"></i> Upload Spreadsheet
                    </button>
                </li>
            </ul>

            <!-- Tab Content -->
            <div class="tab-content" id="inputTabsContent">
                <!-- Text Input Tab -->
                <div class="tab-pane fade show active" id="text-input" role="tabpanel">
                    <div class="mb-3">
                        <label for="pedalList" class="form-label">Enter pedal list (one per line):</label>
                        <textarea 
                            class="form-control" 
                            id="pedalList" 
                            rows="8" 
                            placeholder="Example:&#10;Boss CS-3, excellent condition&#10;Boss CE-2 Taiwan, very good condition&#10;Ibanez TS-9, good condition"></textarea>
                        <small class="form-text text-muted">Format: Pedal Name, Condition (optional)</small>
                    </div>
                    <button class="btn btn-primary" onclick="processTextInput()">
                        <i class="bi bi-calculator"></i> Calculate Prices
                    </button>
                </div>

                <!-- File Input Tab -->
                <div class="tab-pane fade" id="file-input" role="tabpanel">
                    <div class="mb-3">
                        <label for="fileInput" class="form-label">Upload Excel/CSV file:</label>
                        <input type="file" class="form-control" id="fileInput" accept=".xlsx,.xls,.csv">
                        <small class="form-text text-muted">Expected columns: Name, Pedal, Condition (optional)</small>
                    </div>
                    <button class="btn btn-primary" onclick="processFileInput()">
                        <i class="bi bi-upload"></i> Upload & Process
                    </button>
                </div>
            </div>
        </div>

        <!-- Results Section -->
        <div class="results-section" id="resultsSection" style="display: none;">
            <h3 class="mb-4">Results</h3>
            <div id="resultsContainer"></div>
            <div class="mt-4">
                <button class="btn btn-success btn-lg" onclick="downloadResults()">
                    <i class="bi bi-download"></i> Download Excel
                </button>
                <button class="btn btn-secondary btn-lg" onclick="clearResults()">
                    <i class="bi bi-x-circle"></i> Clear Results
                </button>
            </div>
        </div>

                <!-- Loading Indicator -->
                <div class="loading" id="loadingIndicator" style="display: none;">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-3">Processing pedals and calculating prices...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentResults = null;
        let currentUser = null;
        let currentCalculationId = null;

        // Check authentication on page load
        window.addEventListener('DOMContentLoaded', async () => {
            await checkAuth();
        });

        // Authentication functions
        async function checkAuth() {
            try {
                const response = await fetch('/api/user');
                if (response.ok) {
                    const user = await response.json();
                    currentUser = user;
                    updateUIForLoggedIn(user);
                    await loadCalculationHistory();
                } else {
                    updateUIForLoggedOut();
                }
            } catch (error) {
                updateUIForLoggedOut();
            }
        }

        function updateUIForLoggedIn(user) {
            document.getElementById('userInfo').textContent = `Welcome, ${user.name}!`;
            document.getElementById('userInfo').style.display = 'inline';
            document.getElementById('loginBtn').style.display = 'none';
            document.getElementById('logoutBtn').style.display = 'inline';
            document.getElementById('historySection').style.display = 'block';
            document.getElementById('historyPlaceholder').style.display = 'none';
        }

        function updateUIForLoggedOut() {
            document.getElementById('userInfo').style.display = 'none';
            document.getElementById('loginBtn').style.display = 'inline';
            document.getElementById('logoutBtn').style.display = 'none';
            document.getElementById('historySection').style.display = 'none';
            document.getElementById('historyPlaceholder').style.display = 'block';
            currentUser = null;
        }

        function showLoginModal() {
            const modal = new bootstrap.Modal(document.getElementById('authModal'));
            switchAuthTab('login');
            modal.show();
        }

        function switchAuthTab(tab) {
            if (tab === 'login') {
                document.getElementById('loginForm').style.display = 'block';
                document.getElementById('registerForm').style.display = 'none';
                document.getElementById('authModalTitle').textContent = 'Login';
                document.querySelectorAll('#authTabs button').forEach(btn => btn.classList.remove('active'));
                document.querySelectorAll('#authTabs button')[0].classList.add('active');
            } else {
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('registerForm').style.display = 'block';
                document.getElementById('authModalTitle').textContent = 'Register';
                document.querySelectorAll('#authTabs button').forEach(btn => btn.classList.remove('active'));
                document.querySelectorAll('#authTabs button')[1].classList.add('active');
            }
        }

        async function login() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();
                if (data.success) {
                    currentUser = data.user;
                    updateUIForLoggedIn(data.user);
                    bootstrap.Modal.getInstance(document.getElementById('authModal')).hide();
                    await loadCalculationHistory();
                } else {
                    alert('Login failed: ' + (data.error || 'Unknown error'));
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        async function register() {
            const name = document.getElementById('registerName').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });

                const data = await response.json();
                if (data.success) {
                    currentUser = data.user;
                    updateUIForLoggedIn(data.user);
                    bootstrap.Modal.getInstance(document.getElementById('authModal')).hide();
                    alert('Registration successful!');
                } else {
                    alert('Registration failed: ' + (data.error || 'Unknown error'));
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        async function logout() {
            try {
                await fetch('/api/logout', { method: 'POST' });
                currentUser = null;
                updateUIForLoggedOut();
                clearResults();
            } catch (error) {
                alert('Error logging out: ' + error.message);
            }
        }

        async function loadCalculationHistory() {
            if (!currentUser) return;

            try {
                const response = await fetch('/api/calculations');
                const data = await response.json();
                
                const historyList = document.getElementById('historyList');
                if (data.calculations && data.calculations.length > 0) {
                    historyList.innerHTML = `
                        <div class="list-group">
                            ${data.calculations.map(calc => `
                                <div class="list-group-item list-group-item-action" style="cursor: pointer; margin-bottom: 8px; border-radius: 8px;" onclick="loadCalculation('${calc._id}')">
                                    <div class="d-flex w-100 justify-content-between align-items-start">
                                        <div class="flex-grow-1">
                                            <h6 class="mb-1">${calc.title}</h6>
                                            <small class="text-muted">
                                                <i class="bi bi-${calc.inputType === 'text' ? 'textarea-t' : 'file-earmark-spreadsheet'}"></i> ${calc.inputType}
                                                <span class="ms-2"><i class="bi bi-calendar"></i> ${new Date(calc.createdAt).toLocaleDateString()}</span>
                                            </small>
                                        </div>
                                    </div>
                                    <div class="mt-2 d-flex justify-content-between">
                                        <small><strong>Price:</strong> $${calc.totalPrice.toFixed(2)}</small>
                                        <small><strong>Offer:</strong> $${calc.totalOffer.toFixed(2)}</small>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `;
                } else {
                    historyList.innerHTML = '<p class="text-muted text-center">No calculation history yet.</p>';
                }
            } catch (error) {
                console.error('Error loading history:', error);
            }
        }

        async function loadCalculation(calculationId) {
            try {
                const response = await fetch(`/api/calculations/${calculationId}`);
                const data = await response.json();
                
                if (data.calculation) {
                    let results = data.calculation.results;
                    
                    // Handle old format (array) - convert to new format (object)
                    if (Array.isArray(results)) {
                        results = {
                            "All Pedals": {
                                pedals: results.map(r => ({
                                    pedal: r.pedalName || r.pedal || "",
                                    condition: r.condition || "Unknown",
                                    matchedProduct: r.matchedProduct || null,
                                    brand: r.brand || null,
                                    price: r.price || null,
                                    offer: r.offer || 0,
                                    hasPriceGuide: r.hasPriceGuide || false
                                })),
                                totalPrice: data.calculation.totalPrice || 0,
                                totalOffer: data.calculation.totalOffer || 0
                            }
                        };
                    }
                    
                    // Ensure results is an object with the correct structure
                    if (typeof results !== 'object' || results === null) {
                        throw new Error('Invalid calculation format');
                    }
                    
                    // Validate structure - each key should have pedals array
                    for (const [personName, personData] of Object.entries(results)) {
                        if (!personData || !Array.isArray(personData.pedals)) {
                            throw new Error(`Invalid format for ${personName}`);
                        }
                    }
                    
                    currentResults = results;
                    currentCalculationId = calculationId;
                    displayResults(results, Object.keys(results).length > 1);
                    document.getElementById('resultsSection').style.display = 'block';
                }
            } catch (error) {
                console.error('Error loading calculation:', error);
                alert('Error loading calculation: ' + error.message);
            }
        }

        // Process text input
        async function processTextInput() {
            if (!currentUser) {
                alert('Please login first');
                showLoginModal();
                return;
            }

            const text = document.getElementById('pedalList').value.trim();
            if (!text) {
                alert('Please enter at least one pedal');
                return;
            }

            // Parse pedals from text
            const lines = text.split('\n').filter(line => line.trim());
            const pedals = lines.map(line => {
                const parts = line.split(',').map(p => p.trim());
                return {
                    name: parts[0] || line.trim(),
                    condition: parts[1] || 'Unknown'
                };
            });

            await searchPedals(pedals);
        }

        // Search pedals via API
        async function searchPedals(pedals) {
            showLoading();

            try {
                const response = await fetch('/api/search', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ pedals })
                });

                const data = await response.json();
                
                if (data.error) {
                    alert('Error: ' + data.error);
                    hideLoading();
                    return;
                }

                // Results are already in the correct format from backend
                currentResults = data.results;
                currentCalculationId = data.calculationId;
                displayResults(data.results, Object.keys(data.results).length > 1);
                hideLoading();
                await loadCalculationHistory(); // Refresh history
            } catch (error) {
                console.error('Error:', error);
                alert('Error searching pedals: ' + error.message);
                hideLoading();
            }
        }

        // Process file input
        async function processFileInput() {
            if (!currentUser) {
                alert('Please login first');
                showLoginModal();
                return;
            }

            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            
            if (!file) {
                alert('Please select a file');
                return;
            }

            const formData = new FormData();
            formData.append('file', file);

            showLoading();

            try {
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                
                if (data.error) {
                    alert('Error: ' + data.error);
                    hideLoading();
                    return;
                }

                currentResults = data.results;
                currentCalculationId = data.calculationId;
                displayResults(data.results, true);
                hideLoading();
                await loadCalculationHistory(); // Refresh history
            } catch (error) {
                console.error('Error:', error);
                alert('Error processing file: ' + error.message);
                hideLoading();
            }
        }

        // Search pedals via API
        async function searchPedals(pedals) {
            showLoading();

            try {
                const response = await fetch('/api/search', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ pedals })
                });

                const data = await response.json();
                
                if (data.error) {
                    alert('Error: ' + data.error);
                    hideLoading();
                    return;
                }

                // Results are already in the correct format from backend
                currentResults = data.results;
                currentCalculationId = data.calculationId;
                displayResults(data.results, Object.keys(data.results).length > 1);
                hideLoading();
                await loadCalculationHistory(); // Refresh history
            } catch (error) {
                console.error('Error:', error);
                alert('Error searching pedals: ' + error.message);
                hideLoading();
            }
        }

        // Display results
        function displayResults(results, isMultiPerson) {
            const container = document.getElementById('resultsContainer');
            container.innerHTML = '';

            for (const [personName, personData] of Object.entries(results)) {
                const card = document.createElement('div');
                card.className = 'card mb-4';
                card.innerHTML = `
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0"><i class="bi bi-person"></i> ${personName}</h4>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped">
                                <thead>
                                    <tr>
                                        <th>Pedal</th>
                                        <th>Condition</th>
                                        <th>Brand</th>
                                        <th class="text-end">Price</th>
                                        <th class="text-end">Offer</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${personData.pedals.map(p => `
                                        <tr>
                                            <td>${p.matchedProduct || `<span class="no-match">${p.pedal} (No match)</span>`}</td>
                                            <td>${p.condition}</td>
                                            <td>${p.brand || '-'}</td>
                                            <td class="text-end price-cell">${p.price ? '$' + p.price.toFixed(2) : 'N/A'}</td>
                                            <td class="text-end offer-cell">${p.offer ? '$' + p.offer.toFixed(2) : '$0.00'}</td>
                                        </tr>
                                    `).join('')}
                                    <tr class="total-row">
                                        <td colspan="3"><strong>TOTAL</strong></td>
                                        <td class="text-end price-cell"><strong>$${personData.totalPrice.toFixed(2)}</strong></td>
                                        <td></td>
                                    </tr>
                                    <tr class="offer-row">
                                        <td colspan="3"><strong>OFFER</strong></td>
                                        <td></td>
                                        <td class="text-end offer-cell"><strong>$${personData.totalOffer.toFixed(2)}</strong></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            }

            document.getElementById('resultsSection').style.display = 'block';
        }

        // Download results as Excel
        async function downloadResults() {
            if (!currentResults) {
                alert('No results to download');
                return;
            }

            try {
                const response = await fetch('/api/download', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ data: currentResults })
                });

                if (!response.ok) {
                    throw new Error('Download failed');
                }

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `pedal_prices_${Date.now()}.xlsx`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
            } catch (error) {
                console.error('Error:', error);
                alert('Error downloading file: ' + error.message);
            }
        }

        // Clear results
        function clearResults() {
            currentResults = null;
            document.getElementById('resultsSection').style.display = 'none';
            document.getElementById('resultsContainer').innerHTML = '';
            document.getElementById('pedalList').value = '';
            document.getElementById('fileInput').value = '';
        }

        // Show/hide loading
        function showLoading() {
            document.getElementById('loadingIndicator').style.display = 'block';
            document.getElementById('resultsSection').style.display = 'none';
        }

        function hideLoading() {
            document.getElementById('loadingIndicator').style.display = 'none';
        }
    </script>
</body>
</html>
